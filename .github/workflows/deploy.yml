name: Deploy Pendex Frontend

# Builds packages/home — the whole site, home page at / and the user
# guide + generated API reference nested at /docs — as a single Vite
# multi-page build, then uploads it directly as the GitHub Pages
# artifact. Used to be two workspace packages (home + api-docs) built
# separately and stitched together; they're one package now, so this
# is just one build and one upload.
on:
    push:
        branches: [main] # Adjust if your base target branch is 'master'

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            # Runs, in order: typedoc (writes packages/home/public/docs/api),
            # tsc -b, then vite build — see packages/home/package.json.
            - name: Build site
              run: bun run build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: packages/home/dist

    deploy:
        needs: build-and-deploy
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
