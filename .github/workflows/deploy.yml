name: Deploy Pendex Frontend

# Builds packages/home — the whole site, home page at / and the user
# guide + generated API reference nested at /docs — as a single Vite
# multi-page build, then uploads it directly as the GitHub Pages
# artifact. Used to be two workspace packages (home + api-docs) built
# separately and stitched together; they're one package now, so this
# is just one build and one upload.
on:
    push:
        branches: [main] # Adjust if your base target branch is 'master'

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pages: write
            id-token: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            # Runs, in order: typedoc (writes packages/home/public/docs/api),
            # tsc -b, then vite build — see packages/home/package.json.
            - name: Build site
              run: bun run build

            # packages/home/public/docs/api is committed (not gitignored —
            # see AGENTS.md), so the generated API reference is browsable
            # from the repo itself and a fresh clone's dev server has it
            # without an extra manual step. TypeDoc's output is
            # byte-for-byte deterministic given identical source, so this
            # only ever commits when a library package's actual JSDoc
            # comments changed — never noise. `[skip ci]` stops this
            # commit from re-triggering the workflow (GitHub's built-in
            # behavior for push events), so there's no infinite loop.
            - name: Sync generated API docs
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add packages/home/public/docs/api
                  if ! git diff --staged --quiet; then
                    git commit -m "chore: sync generated API docs [skip ci]"
                    git push origin HEAD:main
                  fi

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: packages/home/dist

    deploy:
        needs: build-and-deploy
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
