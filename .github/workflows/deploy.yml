      # Stage both builds into one directory tree before upload: home's
      # build becomes the site root, api-docs's build is nested under
      # docs/ to match its vite.config.ts base of '/pendex/docs/'.
      - name: Combine builds
        run: |
          mkdir -p site
          cp -r packages/home/dist/. site/
          mkdir -p site/docs
          cp -r packages/api-docs/dist/. site/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
