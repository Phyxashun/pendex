name: Deploy Pendex Frontend

# Builds packages/home (the site root) and packages/api-docs (the
# generated user guide + TypeDoc API reference), then combines them
# into a single GitHub Pages artifact — home at /, api-docs nested at
# /docs/. GitHub Pages only serves one artifact per repo, so both apps
# have to land in one upload rather than two competing workflows.
on:
  push:
    branches: [main] # Adjust if your base target branch is 'master'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build home
        run: bun run build:home

      # typedoc runs first (via api-docs's own "build" script) and writes
      # into packages/api-docs/public/api, so `vite build` picks it up as
      # static assets and copies it into packages/api-docs/dist/api
      # automatically.
      - name: Build api-docs
        run: bun run --cwd packages/api-docs build

      # Stage both builds into one directory tree before upload: home's
      # build becomes the site root, api-docs's build is nested under
      # docs/ to match its vite.config.ts base of '/pendex/docs/'.
      - name: Combine builds
        run: |
          mkdir -p site
          cp -r packages/home/dist/. site/
          mkdir -p site/docs
          cp -r packages/api-docs/dist/. site/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
