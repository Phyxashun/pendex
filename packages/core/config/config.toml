    "**/webpack.config.*",
    "**/vite.config.*",
    "**/rollup.config.*",
    "**/next.config.*",
    "**/nuxt.config.*",
    "**/gatsby-config.*",
    "**/gulpfile.*",
    "**/*/settings.json",
    "**/.vscode/**/*.json",
    "**/.idea/**/*.xml",
]
exclude = [
    "**/*.lock",
    "**/*.ts",
    "**/*.ps1",
    "**/*.md",
    "**/*.txt",
    "**/*cspell*",
]

###############################################################################
## DOCUMENTATION FILES
###############################################################################
[[jobs]]
filename = "6_DOC_FILES.txt"
category = "documentation"
description = "Documentation files"
include = [
    "**/README*",
    "**/readme*",
    "**/README.*",
    "**/readme.*",
    "**/LICENSE*",
    "**/license*",
    "**/LICENSE.*",
    "**/license.*",
    "**/COPYING*",
    "**/NOTICE*",
    "**/CHANGELOG*",
    "**/changelog*",
    "**/CHANGELOG.*",
    "**/changelog.*",
    "**/HISTORY*",
    "**/RELEASES*",
    "**/*.md",
    "**/*.markdown",
    "**/*.mdx",
    "**/*.rst",
    "**/*.adoc",
    "**/*.asciidoc",
    "**/*.txt",
    "**/CONTRIBUTING*",
    "**/contributing*",
    "**/CODE_OF_CONDUCT*",
    "**/code_of_conduct*",
    "**/SECURITY*",
    "**/SUPPORT*",
    "**/docs/**/*",
    "**/doc/**/*",
    "**/.github/ISSUE_TEMPLATE/**/*",
    "**/.github/PULL_REQUEST_TEMPLATE/**/*",
]
