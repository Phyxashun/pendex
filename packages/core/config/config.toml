    "**/*.lock",
    "**/*.ts",
    "**/*.json",
    "**/*.md",
    "**/*.toml",
    "**/*.txt",
    "**/*cspell*",
]

###############################################################################
## CONFIGURATION FILES
###############################################################################
[[jobs]]
filename = "5_CONFIG_FILES.txt"
category = "configuration"
description = "Configuration files"
include = [
    "**/*.json",
    "**/*.jsonc",
    "**/*.yaml",
    "**/*.yml",
    "**/*.toml",
    "**/*.config.*",
    "**/config.*",
