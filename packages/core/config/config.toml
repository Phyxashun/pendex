    "**/.gitattributes",
    "**/.gitmodules",
    "**/.env*",
    "**/Dockerfile*",
    "**/docker-compose*.yml",
    "**/.github/workflows/*.yml",
    "**/package.json",
    "**/package-lock.json",
    "**/yarn.lock",
    "**/pnpm-lock.yaml",
    "**/bun.lockb",
    "**/composer.json",
    "**/composer.lock",
    "**/Cargo.toml",
    "**/Cargo.lock",
    "**/Gemfile",
    "**/Gemfile.lock",
