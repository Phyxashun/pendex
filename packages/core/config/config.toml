# FILE-PATH: src/config/config.toml

# DEFAULT THEME
theme = "default"

# DEFAULT OUTPUT DIRECTORIES
outputDir = "ALL"
rebuiltDir = "ALL_REBUILT"

# DEFAULT GLOBAL EXCLUDES
exclude = [
    "**/node_modules/**",
    "**/.git/**",
    "**/dist/**",
    "**/build/**",
    "**/*.lockb",
    "**/*.lock",
    "**/package-lock.json",
    "**/*.map",
    "**/*.png",
    "**/*.jpg",
    "**/*.ico",
    "**/*.gif",
    "**/*.mp4",
    "**/*.mp3",
    "**/*.pnpm-lock.yaml",
    "**/*.min.js",
    "**/*.js.map",
    "**/*.min.css",
    "coverage/**/*",
    "node_modules/**/*",
    "ALL/**/*",
    "**/.env",
    "*/ALL/**/*",
    "*/ALL_REBUILT/**/*",
    "**/.stylelintrc*",
    "**/stylelint.config.*",
    # Added: without this, DOC_FILES' broad "**/*.txt" include swept
    # generated test-run logs into the "documentation" archive — its
    # description promises "Documentation files", not build artifacts.
    "logs/**",
]

# DEFAULT INCLUDED JOBS
[[jobs]]
filename = "1_SOURCE_FILES.txt"
category = "source"
description = "Project source files (ts, js, etc.)"
include = [
    "**/*.js",
    "**/*.jsx",
    "**/*.mjs",
    "**/*.cjs",
    "**/*.ts",
    "**/*.tsx",
    "**/*.mts",
    "**/*.cts",
    "**/*.vue",
    "**/*.svelte",
    "**/*.astro",
    "**/*.py",
    "**/*.pyw",
    "**/*.c",
    "**/*.h",
    "**/*.cpp",
    "**/*.hpp",
    "**/*.cc",
    "**/*.hh",
    "**/*.rs",
    "**/*.zig",
    "**/*.java",
    "**/*.kt",
    "**/*.kts",
    "**/*.scala",
    "**/*.groovy",
    "**/*.cs",
    "**/*.fs",
    "**/*.vb",
    "**/*.swift",
    "**/*.m",
    "**/*.mm",
    "**/*.dart",
    "**/*.go",
    "**/*.rb",
    "**/*.rbw",
    "**/*.php",
    "**/*.hs",
    "**/*.ex",
    "**/*.exs",
    "**/*.erl",
    "**/*.clj",
    "**/*.sql",
]
exclude = [
    "**/*.lock",
    "**/*.json",
    "**/*.md",
    "**/*.toml",
    "**/*.txt",
    "**/*.config.*",
    "**/config.*",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/__tests__/**/*",
    "**/__snapshots__/**/*",
    "**/__mocks__/**/*",
    "**/tests/**/*",
    "**/specs/**/*",
    "**/test/**/*",
]

[[jobs]]
filename = "2_WEB_FILES.txt"
category = "web"
description = "Webpage files"
include = [
    "**/*.html",
    "**/*.htm",
    "**/*.xhtml",
    "**/*.xht",
    "**/*.mhtml",
    "**/*.riot",
    "**/*.ejs",
    "**/*.pug",
    "**/*.jade",
    "**/*.handlebars",
    "**/*.hbs",
    "**/*.mustache",
    "**/*.twig",
    "**/*.nunjucks",
    "**/*.njk",
    "**/*.phtml",
    "**/*.jsp",
    "**/*.jspx",
    "**/*.asp",
    "**/*.aspx",
    "**/*.cshtml",
    "**/*.vbhtml",
    "**/*.j2",
    "**/*.jinja",
    "**/*.jinja2",
    "**/*.erb",
    "**/*.webmanifest",
]
exclude = [
    "**/*.lock",
    "**/*.ts",
    "**/*.ps1",
    "**/*.json",
    "**/*.md",
    "**/*.toml",
    "**/*.txt",
    "**/__tests__/**/*",
    "**/tests/**/*",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*.css",
    "**/*.scss",
    "**/*.sass",
    "**/*.less",
    "**/*.styl",
    "**/*.pcss",
    "**/*.sss",
    "**/*.wxss",
    "**/*.acss",
]

[[jobs]]
filename = "3_STYLE_FILES.txt"
category = "style"
description = "Style files (css, scss, etc.)"
include = [
    "**/*.css",
    "**/*.scss",
    "**/*.sass",
    "**/*.less",
    "**/*.styl",
    "**/*.pcss",
    "**/*.sss",
    "**/*.wxss",
    "**/*.acss",
]
exclude = [
    "**/*.lock",
    "**/*.ts",
    "**/*.ps1",
    "**/*.json",
    "**/*.md",
    "**/*.toml",
    "**/*.txt",
    "**/.stylelintrc*",
    "**/stylelint.config.*",
]

[[jobs]]
filename = "4_TERMINAL_FILES.txt"
category = "terminal"
description = "Command line files"
include = ["**/*.ps1", "**/*.bash", "**/*.sh", "**/*.fish", "**/*.zsh"]
exclude = [
    "**/*.lock",
    "**/*.ts",
    "**/*.json",
    "**/*.md",
    "**/*.toml",
    "**/*.txt",
]

[[jobs]]
filename = "5_CONFIG_FILES.txt"
category = "configuration"
description = "Configuration files"
include = [
    "**/*.json",
    "**/*.jsonc",
    "**/*.yaml",
    "**/*.yml",
    "**/*.toml",
    "**/*.config.*",
    "**/config.*",
    "**/.editorconfig",
    "**/.browserslistrc",
    "**/browserslist",
    "**/*ignore",
    "**/.gitattributes",
    "**/.gitmodules",
    "**/.env*",
    "**/Dockerfile*",
    "**/docker-compose*.yml",
    "**/.github/workflows/*.yml",
    "**/package.json",
    "**/package-lock.json",
    "**/yarn.lock",
    "**/pnpm-lock.yaml",
    "**/bun.lockb",
    "**/composer.json",
    "**/composer.lock",
    "**/Cargo.toml",
    "**/Cargo.lock",
    "**/Gemfile",
    "**/Gemfile.lock",
    "**/.eslintrc*",
    "**/eslint.config.*",
    "**/.prettierrc*",
    "**/prettier.config.*",
    "**/.stylelintrc*",
    "**/stylelint.config.*",
    "**/tsconfig*.json",
    "**/.babelrc*",
    "**/babel.config.*",
    "**/webpack.config.*",
    "**/vite.config.*",
    "**/rollup.config.*",
    "**/next.config.*",
    "**/nuxt.config.*",
    "**/gatsby-config.*",
    "**/gulpfile.*",
    "**/*/settings.json",
    "**/.vscode/**/*.json",
    "**/.idea/**/*.xml",
]
exclude = ["**/*.lock", "**/*.ts", "**/*.ps1", "**/*.md", "**/*.txt"]

[[jobs]]
filename = "6_DOC_FILES.txt"
category = "documentation"
description = "Documentation files"
include = [
    "**/README*",
    "**/readme*",
    "**/README.*",
    "**/readme.*",
    "**/LICENSE*",
    "**/license*",
    "**/LICENSE.*",
    "**/license.*",
    "**/COPYING*",
    "**/NOTICE*",
    "**/CHANGELOG*",
    "**/changelog*",
    "**/CHANGELOG.*",
    "**/changelog.*",
    "**/HISTORY*",
    "**/RELEASES*",
    "**/*.md",
    "**/*.markdown",
    "**/*.mdx",
    "**/*.rst",
    "**/*.adoc",
    "**/*.asciidoc",
    "**/*.txt",
    "**/CONTRIBUTING*",
    "**/contributing*",
    "**/CODE_OF_CONDUCT*",
    "**/code_of_conduct*",
    "**/SECURITY*",
    "**/SUPPORT*",
    "**/docs/**/*",
    "**/doc/**/*",
    "**/.github/ISSUE_TEMPLATE/**/*",
    "**/.github/PULL_REQUEST_TEMPLATE/**/*",
]
exclude = ["**/*.lock", "**/*.ts", "**/*.ps1", "**/*.json", "**/*.toml"]

[[jobs]]
filename = "7_TEST_FILES.txt"
category = "testing"
description = "Test files"
include = [
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/*-test.*",
    "**/test-*.*",
    "**/test.*",
    "**/test/**/*.*",
    "**/test_*.py",
    "**/*Test.php",
    "**/*Spec.scala",
    "**/__tests__/**/*",
    "**/__snapshots__/**/*",
    "**/__mocks__/**/*",
    "**/tests/**/*",
    "**/specs/**/*",
    "**/test/**/*",
    "**/jest.config.*",
    "**/vitest.config.*",
    "**/playwright.config.*",
    "**/cypress.config.*",
    "**/karma.conf.*",
    "**/setupTests.*",
    "**/test-setup.*",
    "**/test.setup.*",
]
exclude = []

[[jobs]]
filename = "8_MISC_FILES.txt"
category = "misc"
description = "All remaining project files"
# Empty include = "remainder job": FileScanner.resolveJobFiles() treats an
# empty include list as "everything not already claimed by an earlier
# job", not "nothing". This job must stay LAST in this array — remainder
# resolution depends on every prior job having already run. See
# src/core/FileScanner.ts and src/core/CompileService.ts.
include = []
exclude = []
