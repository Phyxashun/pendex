# FILE-PATH: src/config/config.toml
#
# DEFAULT THEME
#
theme = { name = "pendex", path = "packages/theme/themes/" }

#
# DEFAULT OUTPUT CONFIGURATION
#
http       = true
outputType = "pdf"         # "txt" or "pdf"
outputDir  = "ALL"
rebuiltDir = "ALL_REBUILT"

#
# DEFAULT GLOBAL EXCLUDES
#
exclude = [
    # General
    "**/node_modules/**",
    "**/.git/**",
    "**/*.lockb",
    "**/*.lock",
    "**/package-lock.json",
    "**/*.pnpm-lock.yaml",
    "**/.env",

    # Build
    "**/dist/**",
    "**/build/**",
    "**/*.map",
    "**/*.min.js",
    "**/*.js.map",
    "**/*.min.css",
    "**/coverage/**",
    "**/.stylelintrc*",
    "**/stylelint.config.*",
    "**/logs/**",

    # Fonts
    "**/*.ttf",
    "**/*.otf",
    "**/*.woff",
    "**/*.woff2",
    "**/*.eot",

    # Docs
    "**/*.pdf",
    "**/*.doc",
    "**/*.docx",
    "**/*.ppt",
    "**/*.pptx",
    "**/*.xls",
    "**/*.xlsx",

    # Raster/Vector
    "**/*.png",
    "**/*.jpg",
    "**/*.jpeg",
    "**/*.gif",
    "**/*.bmp",
    "**/*.ico",
    "**/*.webp",
    "**/*.tiff",
    "**/*.psd",
    "**/*.heic",

    # Audio/Video
    "**/*.mp3",
    "**/*.mp4",
    "**/*.wav",
    "**/*.mov",
    "**/*.avi",
    "**/*.webm",
    "**/*.ogg",

    # Archives/Binaries
    "**/*.zip",
    "**/*.tar",
    "**/*.gz",
    "**/*.7z",
    "**/*.rar",
    "**/*.exe",
    "**/*.dll",
    "**/*.so",
    "**/*.dylib",
    "**/*.wasm",
    "**/*.class",
    "**/*.jar",
    "**/*.db",
    "**/*.sqlite",

    # Pendex Specific
    "**/ALL/**",
    "**/ALL_REBUILT/**",
]

#
# DEFAULT INCLUDE JOBS
#
###############################################################################
## SOURCE FILES
###############################################################################
[[jobs]]
filename = "1_SOURCE_FILES.txt"
category = "source"
description = "Project source files (ts, js, etc.)"
include = [
    "**/*.js",
    "**/*.jsx",
    "**/*.mjs",
    "**/*.cjs",
    "**/*.ts",
    "**/*.tsx",
    "**/*.mts",
    "**/*.cts",
    "**/*.vue",
    "**/*.svelte",
    "**/*.astro",
    "**/*.py",
    "**/*.pyw",
    "**/*.c",
    "**/*.h",
    "**/*.cpp",
    "**/*.hpp",
    "**/*.cc",
    "**/*.hh",
    "**/*.rs",
    "**/*.zig",
    "**/*.java",
    "**/*.kt",
    "**/*.kts",
    "**/*.scala",
    "**/*.groovy",
    "**/*.cs",
    "**/*.fs",
    "**/*.vb",
    "**/*.swift",
    "**/*.m",
    "**/*.mm",
    "**/*.dart",
    "**/*.go",
    "**/*.rb",
    "**/*.rbw",
    "**/*.php",
    "**/*.hs",
    "**/*.ex",
    "**/*.exs",
    "**/*.erl",
    "**/*.clj",
    "**/*.sql",
]
exclude = [
    "**/*.lock",
    "**/*.json",
    "**/*.md",
    "**/*.toml",
    "**/*.txt",
    "**/*.config.*",
    "**/config.*",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/__tests__/**/*",
    "**/__snapshots__/**/*",
    "**/__mocks__/**/*",
    "**/tests/**/*",
    "**/specs/**/*",
    "**/test/**/*",
    "**/*cspell*",
]

###############################################################################
## WEB FILES
###############################################################################
