    "**/*cspell*",
]

###############################################################################
## TEST FILES
###############################################################################
[[jobs]]
filename = "7_TEST_FILES.txt"
category = "testing"
description = "Test files"
include = [
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/*-test.*",
    "**/test-*.*",
    "**/test.*",
    "**/test/**/*.*",
    "**/test_*.py",
    "**/*Test.php",
    "**/*Spec.scala",
    "**/__tests__/**/*",
    "**/__snapshots__/**/*",
    "**/__mocks__/**/*",
    "**/tests/**/*",
    "**/specs/**/*",
    "**/test/**/*",
    "**/jest.config.*",
    "**/vitest.config.*",
    "**/playwright.config.*",
    "**/cypress.config.*",
    "**/karma.conf.*",
    "**/setupTests.*",
    "**/test-setup.*",
    "**/test.setup.*",
]
exclude = ["**/*cspell*"]

###############################################################################
## CSPELL DICTIONARY AND CONFIGURATION FILES
###############################################################################
[[jobs]]
filename = "8_CSPELL_FILES.txt"
category = "cspell"
description = "CSpell files"
include = [
    # Matches target files in the root directory AND all subdirectories
    "**/*cspell*",
]
exclude = ["**/*cspell-dictionary-*"]

###############################################################################
## MISC. (I.E. EVERYTHING ELSE) FILES
###############################################################################
[[jobs]]
filename    = "9_MISC_FILES.txt"
category    = "misc"
description = "All remaining project files"
# Empty include = "remainder job": FileScanner.resolveJobFiles() treats an
# empty include list as "everything not already claimed by an earlier
# job", not "nothing". This job must stay LAST in this array — remainder
# resolution depends on every prior job having already run. See
# src/core/FileScanner.ts and src/core/CompileService.ts.
include = []
exclude = ["**/*cspell*", "**/*cspell-dictionary*.txt", "**/*.svg"]
