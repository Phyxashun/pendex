# ============================================================================
# Monokai Pro Theme for Pendex
# https://monokai.pro
#
# Mirrors pendex.toml's layout exactly. Background/titleBg standardized
# to #1A1A1A/#262626; every other color is Monokai Pro's own published
# "Classic" filter palette — already dark-terminal-legible by design,
# verified against both backgrounds (WCAG-AA 4.5:1 for text, 3:1 for
# the intentionally de-emphasized comment/muted color).
# ============================================================================

name        = "Monokai Pro"
author      = "Monokai.pro & contributors"
version     = "1.1.0"
description = "Monokai Pro (Classic filter), mirrored to Pendex's theme layout."

###############################################################################
# ThemeColors interface
###############################################################################

primary     = "#FFD866"
secondary   = "#AB9DF2"
success     = "#A9DC76"
warning     = "#FC9867"
error       = "#FF6188"
info        = "#78DCE8"
muted       = "#727072"
foreground  = "#FCFCFA"
background  = "#1A1A1A"
titleBg     = "#262626"

###############################################################################
# Extended Brand Palette
###############################################################################

[palette]

background      = "#2D2A2E"
surface         = "#403E41"
foreground      = "#FCFCFA"
comment         = "#727072"
yellow          = "#FFD866"
purple          = "#AB9DF2"
green           = "#A9DC76"
orange          = "#FC9867"
pink            = "#FF6188"
cyan            = "#78DCE8"

###############################################################################
# Website
###############################################################################
#
# Shared across every theme — the Pendex site keeps one identity
# regardless of which terminal accent theme is active.

[website]

heroBackground  = "#F7F2E8"
cardBackground  = "#ECE3D4"
border          = "#000000"
heading         = "#2E2A27"
body            = "#443E39"
link            = "#3F5D78"
linkHover       = "#6AAFB5"
buttonPrimary   = "#D6A448"
buttonHover     = "#E8C56A"
buttonText      = "#1A1A1A"
shadow          = "#00000055"
grid            = "#DDD2C2"
math            = "#8B5E3C"

###############################################################################
# Terminal
###############################################################################

[terminal]

cursor          = "#FFD866"
cursorText      = "#1A1A1A"
selection       = "#5B595C"
findHighlight   = "#FC9867"
inactiveSelection = "#2C2C2C"

###############################################################################
# ANSI
###############################################################################

[ansi]

black           = "#403E41"
red             = "#FF6188"
green           = "#A9DC76"
yellow          = "#FFD866"
blue            = "#FC9867"
magenta         = "#AB9DF2"
cyan            = "#78DCE8"
white           = "#FCFCFA"
brightBlack     = "#727072"
brightRed       = "#FF6188"
brightGreen     = "#A9DC76"
brightYellow    = "#FFD866"
brightBlue      = "#FC9867"
brightMagenta   = "#AB9DF2"
brightCyan      = "#78DCE8"
brightWhite     = "#FCFCFA"

###############################################################################
# Syntax Highlighting
###############################################################################

[syntax]

keyword         = "#FF6188"
type            = "#78DCE8"
class           = "#78DCE8"
interface       = "#78DCE8"
function        = "#A9DC76"
string          = "#FFD866"
number          = "#AB9DF2"
constant        = "#AB9DF2"
property        = "#FCFCFA"
operator        = "#FF6188"
comment         = "#727072"
regex           = "#FC9867"
attribute       = "#A9DC76"
namespace       = "#78DCE8"

###############################################################################
# Git
###############################################################################

[git]

added           = "#A9DC76"
modified        = "#FFD866"
deleted         = "#FF6188"
renamed         = "#78DCE8"
ignored         = "#727072"

###############################################################################
# Diagnostics
###############################################################################

[diagnostics]

hint            = "#78DCE8"
info            = "#AB9DF2"
warning         = "#FC9867"
error           = "#FF6188"

###############################################################################
# Diff
###############################################################################

[diff]

addedBackground = "#28331E"
removedBackground = "#33202A"
modifiedBackground = "#332E1E"

###############################################################################
# Pendex Brand
###############################################################################
#
# Keys under `source`/`web`/`style`/`terminal`/`configuration`/
# `documentation`/`testing`/`misc` are looked up by the CLI to color a
# compile/split job's title by its Category — they must match the
# Category string exactly (e.g. `configuration`, not `config`) or that
# job silently falls back to the theme's default styling instead.

[brand]

bookCover       = "#24303A"
bookSpine       = "#2F3B45"
paper           = "#F7F2E8"
banner          = "#F3E9D6"
outline         = "#000000"
math            = "#8B5E3C"
folder          = "#A9DC76"
manifest        = "#78DCE8"
compile         = "#FFD866"
split           = "#A9DC76"
scanner         = "#AB9DF2"
source          = "#A9DC76"
web             = "#78DCE8"
style           = "#FC9867"
terminal        = "#403E41"
configuration   = "#FC9867"
documentation   = "#78DCE8"
testing         = "#AB9DF2"
misc            = "#727072"
