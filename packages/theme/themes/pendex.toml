# ============================================================================
# Pendex Theme
# "Portable Codex"
#
# THE CANONICAL THEME. Every other theme file mirrors this file's exact
# section layout (see README's Themes section) — only the colors change.
# Backgrounds are fixed at #1A1A1A / #262626 across every theme so no
# theme reads worse than another on a real terminal; every color below
# was checked against both and adjusted (hue preserved, only lightened)
# wherever it fell under WCAG-AA (4.5:1) for text colors, or 3:1 for
# intentionally de-emphasized ones (muted/comment/ignored/brightBlack).
#
# Inspired by:
#   • Homebrew
#   • Parchment & brass
#   • Mathematical manuscripts
#   • Borderlands-style bold outlines
# ============================================================================

name        = "Pendex"
author      = "Dusty Dew"
version     = "1.1.0"
description = "Warm parchment-inspired theme for Pendex — the standard every other theme mirrors."

###############################################################################
# ThemeColors interface
###############################################################################

primary     = "#D6A448"
secondary   = "#6F92B0"
success     = "#799470"
warning     = "#D99C5A"
error       = "#C57967"
info        = "#6AAFB5"
muted       = "#7B746B"
foreground  = "#E9E0D2"
background  = "#1A1A1A"
titleBg     = "#262626"

###############################################################################
# Extended Brand Palette
###############################################################################

[palette]

parchment       = "#E9E0D2"
cream           = "#F7F2E8"
charcoal        = "#1A1A1A"
graphite        = "#262626"
surface         = "#2F2F2F"
surfaceAlt      = "#3A352F"
outline         = "#000000"
brass           = "#D6A448"
gold            = "#E8C56A"
copper          = "#C78C5C"
olive           = "#799470"
forest          = "#5F7458"
blueprint       = "#6F92B0"
inkBlue         = "#3F5D78"
teal            = "#6AAFB5"
plum            = "#A183B2"
brick           = "#C57967"
brickBright     = "#D97763"
ash             = "#7B746B"

###############################################################################
# Website
###############################################################################
#
# Shared across every theme — the Pendex site keeps one identity
# regardless of which terminal accent theme is active.

[website]

heroBackground  = "#F7F2E8"
cardBackground  = "#ECE3D4"
border          = "#000000"
heading         = "#2E2A27"
body            = "#443E39"
link            = "#3F5D78"
linkHover       = "#6AAFB5"
buttonPrimary   = "#D6A448"
buttonHover     = "#E8C56A"
buttonText      = "#1A1A1A"
shadow          = "#00000055"
grid            = "#DDD2C2"
math            = "#8B5E3C"

###############################################################################
# Terminal
###############################################################################

[terminal]

cursor          = "#D6A448"
cursorText      = "#1A1A1A"
selection       = "#3A352F"
findHighlight   = "#E8C56A"
inactiveSelection = "#2C2C2C"

###############################################################################
# ANSI
###############################################################################

[ansi]

black           = "#2C2C2C"
red             = "#C57967"
green           = "#799470"
yellow          = "#D6A448"
blue            = "#6F92B0"
magenta         = "#A183B2"
cyan            = "#6AAFB5"
white           = "#E9E0D2"
brightBlack     = "#717171"
brightRed       = "#D97763"
brightGreen     = "#8FA97F"
brightYellow    = "#E8C56A"
brightBlue      = "#8AB0D6"
brightMagenta   = "#B495C8"
brightCyan      = "#87CDD4"
brightWhite     = "#F7F2E8"

###############################################################################
# Syntax Highlighting
###############################################################################

[syntax]

keyword         = "#C78C5C"
type            = "#8AB0D6"
class           = "#8AB0D6"
interface       = "#8AB0D6"
function        = "#E7C46B"
string          = "#95B184"
number          = "#D99C5A"
constant        = "#D6A448"
property        = "#E9E0D2"
operator        = "#E9E0D2"
comment         = "#7B746B"
regex           = "#6AAFB5"
attribute       = "#D6A448"
namespace       = "#6F92B0"

###############################################################################
# Git
###############################################################################

[git]

added           = "#799470"
modified        = "#D6A448"
deleted         = "#C57967"
renamed         = "#6AAFB5"
ignored         = "#7B746B"

###############################################################################
# Diagnostics
###############################################################################

[diagnostics]

hint            = "#6AAFB5"
info            = "#6F92B0"
warning         = "#D6A448"
error           = "#C57967"

###############################################################################
# Diff
###############################################################################

[diff]

addedBackground = "#2A3A2A"
removedBackground = "#402A2A"
modifiedBackground = "#4A4128"

###############################################################################
# Pendex Brand
###############################################################################
#
# Keys under `source`/`web`/`style`/`terminal`/`configuration`/
# `documentation`/`testing`/`misc` are looked up by the CLI to color a
# compile/split job's title by its Category — they must match the
# Category string exactly (e.g. `configuration`, not `config`) or that
# job silently falls back to the theme's default styling instead.

[brand]

bookCover       = "#24303A"
bookSpine       = "#2F3B45"
paper           = "#F7F2E8"
banner          = "#F3E9D6"
outline         = "#000000"
math            = "#8B5E3C"
folder          = "#799470"
manifest        = "#6AAFB5"
compile         = "#D6A448"
split           = "#799470"
scanner         = "#6F92B0"
source          = "#799470"
web             = "#6F92B0"
style           = "#D99C5A"
terminal        = "#3A352F"
configuration   = "#C78C5C"
documentation   = "#6F92B0"
testing         = "#A183B2"
misc            = "#7B746B"
