# ============================================================================
# Pendex Theme
# "Portable Codex"
#
# THE CANONICAL THEME. Every other theme file mirrors this file's exact
# section layout (see README's Themes section) — only the colors change.
# Backgrounds are fixed at #1A1A1A / #262626 across every theme so no
# theme reads worse than another on a real terminal; every color below
# was checked against both and adjusted (hue preserved, only lightened)
# wherever it fell under WCAG-AA (4.5:1) for text colors, or 3:1 for
# intentionally de-emphasized ones (muted/comment/ignored/brightBlack).
#
# Inspired by:
#   • Homebrew
#   • Parchment & brass
#   • Mathematical manuscripts
#   • Borderlands-style bold outlines
# ============================================================================

name        = "Pendex"
author      = "Dusty Dew"
version     = "1.1.0"
description = "Warm parchment-inspired theme for Pendex."

###############################################################################
# ThemeColors interface
###############################################################################
# NOTE: Added "content" to match DaisyUI update. This is the default text color
# unless a component explicitly uses foreground instead.

primary   = "#D6A448" # Brass
secondary = "#6F92B0" # Blueprint
success   = "#799470" # Olive
warning   = "#D99C5A" # Copper
error     = "#C57967" # Brick
info      = "#6AAFB5" # Teal
muted     = "#7B746B" # Ash

foreground = "#E9E0D2" # Parchment (used for bright text)
content    = "#1A1A1A" # Charcoal (new; semantic content color)
background = "#1A1A1A" # Charcoal
titleBg    = "#262626" # Graphite

###############################################################################
# Extended Brand Palette
###############################################################################

[palette]
parchment   = "#E9E0D2"
cream       = "#F7F2E8"
charcoal    = "#1A1A1A"
graphite    = "#262626"
surface     = "#2F2F2F" # Soft charcoal
surfaceAlt  = "#3A352F" # Warm dark brown
outline     = "#000000"
brass       = "#D6A448"
gold        = "#E8C56A"
copper      = "#C78C5C"
olive       = "#799470"
forest      = "#5F7458"
blueprint   = "#6F92B0"
inkBlue     = "#3F5D78"
teal        = "#6AAFB5"
plum        = "#A183B2"
brick       = "#C57967"
brickBright = "#D97763"
ash         = "#7B746B"

###############################################################################
# Website
###############################################################################
#
# Shared across every theme — the Pendex site keeps one identity
# regardless of which terminal accent theme is active.

[website]
heroBackground = "#F7F2E8"   # Cream
cardBackground = "#ECE3D4"   # Light parchment
border         = "#000000"
heading        = "#2E2A27"   # Deep brown
body           = "#443E39"   # Soft brown
link           = "#3F5D78"   # Ink blue
linkHover      = "#6AAFB5"   # Teal
buttonPrimary  = "#D6A448"   # Brass
buttonHover    = "#E8C56A"   # Gold
buttonText     = "#1A1A1A"   # Charcoal
shadow         = "#00000055"
grid           = "#DDD2C2"   # Muted parchment
math           = "#8B5E3C"   # Math brown

###############################################################################
# Terminal
###############################################################################

[terminal]
cursor            = "#D6A448" # Brass
cursorText        = "#1A1A1A" # Charcoal
selection         = "#3A352F" # Warm dark brown
findHighlight     = "#E8C56A" # Gold
inactiveSelection = "#2C2C2C" # Dark graphite

###############################################################################
# ANSI
###############################################################################

[ansi]
black   = "#2C2C2C" # Graphite
red     = "#C57967" # Brick
green   = "#799470" # Olive
yellow  = "#D6A448" # Brass
blue    = "#6F92B0" # Blueprint
magenta = "#A183B2" # Plum
cyan    = "#6AAFB5" # Teal
white   = "#E9E0D2" # Parchment

brightBlack   = "#717171" # Bright graphite
brightRed     = "#D97763" # Bright brick
brightGreen   = "#8FA97F" # Bright olive
brightYellow  = "#E8C56A" # Gold
brightBlue    = "#8AB0D6" # Bright blueprint
brightMagenta = "#B495C8" # Bright plum
brightCyan    = "#87CDD4" # Bright teal
brightWhite   = "#F7F2E8" # Cream

###############################################################################
# Syntax Highlighting
###############################################################################

[syntax]
keyword   = "#C78C5C" # Copper
type      = "#8AB0D6" # Bright blueprint
class     = "#8AB0D6" # Bright blueprint
interface = "#8AB0D6" # Bright blueprint
function  = "#E7C46B" # Warm gold
string    = "#95B184" # Soft green
number    = "#D99C5A" # Copper
constant  = "#D6A448" # Brass
property  = "#E9E0D2" # Parchment
operator  = "#E9E0D2" # Parchment
comment   = "#7B746B" # Ash
regex     = "#6AAFB5" # Teal
attribute = "#D6A448" # Brass
namespace = "#6F92B0" # Blueprint

###############################################################################
# Git
###############################################################################

[git]
added    = "#799470" # Olive
modified = "#D6A448" # Brass
deleted  = "#C57967" # Brick
renamed  = "#6AAFB5" # Teal
ignored  = "#7B746B" # Ash

###############################################################################
# Diagnostics
###############################################################################

[diagnostics]
hint    = "#6AAFB5" # Teal
info    = "#6F92B0" # Blueprint
warning = "#D6A448" # Brass
error   = "#C57967" # Brick

###############################################################################
# Diff
###############################################################################

[diff]
addedBackground    = "#2A3A2A" # Deep green wash
removedBackground  = "#402A2A" # Deep red wash
modifiedBackground = "#4A4128" # Warm golden wash

###############################################################################
# Pendex Brand
###############################################################################
#
# Keys under `source`/`web`/`style`/`terminal`/`configuration`/
# `documentation`/`testing`/`misc` are looked up by the CLI to color a
# compile/split job's title by its Category — they must match the
# Category string exactly (e.g. `configuration`, not `config`) or that
# job silently falls back to the theme's default styling instead.

[brand]
bookCover     = "#24303A" # Midnight blue
bookSpine     = "#2F3B45" # Steel blue
paper         = "#F7F2E8" # Cream
banner        = "#F3E9D6" # Light parchment
outline       = "#000000" # Black
math          = "#8B5E3C" # Math brown
folder        = "#799470" # Olive
manifest      = "#6AAFB5" # Teal
compile       = "#D6A448" # Brass
split         = "#799470" # Olive
scanner       = "#6F92B0" # Blueprint
source        = "#799470" # Olive
web           = "#6F92B0" # Blueprint
style         = "#D99C5A" # Copper
terminal      = "#3A352F" # Warm dark brown
configuration = "#C78C5C" # Copper
documentation = "#6F92B0" # Blueprint
testing       = "#A183B2" # Plum
misc          = "#7B746B" # Ash
