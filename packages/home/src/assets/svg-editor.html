<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>SVG Editor</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --panel: #ffffff;
      --panel-border: #e0e0e0;
      --accent: #7c5cbf;
      --accent-hover: #6a4faa;
      --text: #1a1a2e;
      --text-muted: #6b7280;
      --canvas-bg: #e8e8e8;
      --toolbar-h: 56px;
      --left-w: 64px;
      --right-w: 268px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--canvas-bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    #topbar {
      height: var(--toolbar-h);
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 4px;
      z-index: 100;
      flex-shrink: 0;
    }

    #logo {
      font-weight: 700;
      font-size: 18px;
      color: var(--accent);
      margin-right: 8px;
      letter-spacing: -0.5px;
    }

    .tb-sep {
      width: 1px;
      height: 28px;
      background: var(--panel-border);
      margin: 0 4px;
      flex-shrink: 0;
    }

    .tb-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tb-btn:hover {
      background: #f3f0ff;
      color: var(--accent);
    }

    .tb-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .tb-btn svg {
      flex-shrink: 0;
    }

    .tb-btn.primary {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .tb-btn.primary:hover {
      background: var(--accent-hover);
    }

    .tb-btn.active-toggle {
      background: #ede9ff;
      color: var(--accent);
    }

    #zoom-display {
      font-size: 13px;
      color: var(--text-muted);
      min-width: 44px;
      text-align: center;
    }

    #filename-display {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .spacer {
      flex: 1;
    }

    /* ── MAIN AREA ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── LEFT PANEL ── */
    #left-panel {
      width: var(--left-w);
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 4px;
      z-index: 50;
    }

    .tool-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      position: relative;
      flex-shrink: 0;
    }

    .tool-btn:hover {
      background: #f3f0ff;
      color: var(--accent);
    }

    .tool-btn.active {
      background: #ede9ff;
      color: var(--accent);
    }

    .tool-btn .tooltip {
      position: absolute;
      left: calc(100% + 8px);
      top: 50%;
      transform: translateY(-50%);
      background: #1a1a2e;
      color: #fff;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 1000;
    }

    .tool-btn:hover .tooltip {
      opacity: 1;
    }

    .left-sep {
      width: 36px;
      height: 1px;
      background: var(--panel-border);
      margin: 4px 0;
    }

    /* ── CANVAS AREA ── */
    #canvas-area {
      flex: 1;
      overflow: auto;
      position: relative;
      background: var(--canvas-bg);
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    #canvas-wrapper {
      position: relative;
      margin: 40px;
      display: inline-block;
      transform-origin: top left;
    }

    #drop-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    #drop-inner {
      background: white;
      border-radius: 16px;
      padding: 60px 80px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
      border: 2px dashed var(--panel-border);
      transition: border-color 0.2s;
      pointer-events: all;
    }

    #drop-inner.drag-over {
      border-color: var(--accent);
    }

    #drop-inner h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    #drop-inner p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    #upload-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
    }

    #upload-btn:hover {
      background: var(--accent-hover);
    }

    #new-btn-welcome {
      background: transparent;
      color: var(--accent);
      border: 1.5px solid var(--accent);
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
      margin-left: 10px;
    }

    #new-btn-welcome:hover {
      background: #f3f0ff;
    }

    #file-input,
    #image-input {
      display: none;
    }

    #svg-container {
      position: relative;
      background: white;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      border-radius: 4px;
      display: none;
      line-height: 0;
    }

    #svg-container svg#main-svg {
      display: block;
    }

    #overlay-svg {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      overflow: visible;
    }

    #overlay-svg .sel-rect {
      fill: none;
      stroke: #7c5cbf;
      stroke-width: 1.5;
    }

    #overlay-svg .resize-handle {
      fill: #fff;
      stroke: #7c5cbf;
      stroke-width: 1.5;
      pointer-events: all;
    }

    #overlay-svg .rotate-handle {
      fill: var(--accent);
      stroke: #fff;
      stroke-width: 1.5;
      pointer-events: all;
      cursor: grab;
    }

    #overlay-svg .rotate-stem {
      stroke: #7c5cbf;
      stroke-width: 1;
      pointer-events: none;
    }

    #overlay-svg .rubber-band {
      fill: rgba(124, 92, 191, 0.08);
      stroke: #7c5cbf;
      stroke-width: 1;
      stroke-dasharray: 4 3;
      pointer-events: none;
    }

    #overlay-svg .group-border {
      fill: none;
      stroke: #f59e0b;
      stroke-width: 1.5;
      stroke-dasharray: 6 3;
      pointer-events: none;
    }

    #group-mode-banner {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: #f59e0b;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 20px;
      z-index: 300;
      display: none;
      pointer-events: none;
      white-space: nowrap;
    }

    /* ── RIGHT PANEL ── */
    #right-panel {
      width: var(--right-w);
      background: var(--panel);
      border-left: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 50;
    }

    .rp-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--panel-border);
    }

    .rp-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .rp-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 6px;
    }

    .rp-label {
      font-size: 13px;
      color: var(--text-muted);
      min-width: 52px;
    }

    .rp-input {
      flex: 1;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 5px 7px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: #fafafa;
      outline: none;
      transition: border-color 0.15s;
      min-width: 0;
    }

    .rp-input:focus {
      border-color: var(--accent);
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      cursor: pointer;
      padding: 0;
      overflow: hidden;
      flex-shrink: 0;
    }

    .color-swatch input[type="color"] {
      width: 200%;
      height: 200%;
      margin: -25%;
      border: none;
      padding: 0;
      cursor: pointer;
      background: transparent;
    }

    .rp-range {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .rp-val {
      font-size: 12px;
      color: var(--text-muted);
      min-width: 34px;
      text-align: right;
    }

    .rp-btn {
      width: 100%;
      padding: 7px;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      background: #fafafa;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s;
      margin-bottom: 5px;
      text-align: center;
    }

    .rp-btn:hover {
      background: #f3f0ff;
      color: var(--accent);
      border-color: var(--accent);
    }

    .rp-btn.danger:hover {
      background: #fff0f0;
      color: #e03131;
      border-color: #e03131;
    }

    .rp-btn.active-toggle {
      background: #ede9ff;
      color: var(--accent);
      border-color: var(--accent);
    }

    .rp-select {
      flex: 1;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 5px 7px;
      font-size: 13px;
      font-family: inherit;
      background: #fafafa;
      color: var(--text);
      outline: none;
      cursor: pointer;
      min-width: 0;
    }

    #no-selection-msg {
      padding: 24px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .checker-bg {
      background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%);
      background-size: 8px 8px;
      background-position: 0 0, 0 4px, 4px -4px, -4px 0;
    }

    #layers-list {
      max-height: 180px;
      overflow-y: auto;
    }

    .layer-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 6px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text);
      transition: background 0.12s;
      user-select: none;
    }

    .layer-item:hover {
      background: #f3f0ff;
    }

    .layer-item.selected {
      background: #ede9ff;
      color: var(--accent);
      font-weight: 600;
    }

    .layer-icon {
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .layer-vis {
      margin-left: auto;
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 2px;
      border-radius: 3px;
    }

    .layer-vis:hover {
      color: var(--accent);
    }

    /* align buttons grid */
    .align-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .align-btn {
      padding: 6px 4px;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      background: #fafafa;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s;
      text-align: center;
    }

    .align-btn:hover {
      background: #f3f0ff;
      color: var(--accent);
      border-color: var(--accent);
    }

    /* icon toggle buttons (bold/italic) */
    .icon-toggle {
      flex: 1;
      padding: 5px;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      background: #fafafa;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s;
      text-align: center;
    }

    .icon-toggle:hover,
    .icon-toggle.on {
      background: #ede9ff;
      color: var(--accent);
      border-color: var(--accent);
    }

    /* ── CONTEXT MENU ── */
    #ctx-menu {
      position: fixed;
      z-index: 9000;
      display: none;
      background: white;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      padding: 4px 0;
      min-width: 170px;
      user-select: none;
    }

    .cm-item {
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .cm-item:hover {
      background: #f3f0ff;
      color: var(--accent);
    }

    .cm-item.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    .cm-item.danger:hover {
      background: #fff0f0;
      color: #e03131;
    }

    .cm-kbd {
      font-size: 11px;
      color: var(--text-muted);
    }

    .cm-sep {
      height: 1px;
      background: var(--panel-border);
      margin: 4px 0;
    }

    /* ── SNACKBAR ── */
    #snackbar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      color: #fff;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 9999;
      transition: transform 0.25s ease;
      pointer-events: none;
      background: #1a1a2e;
    }

    #snackbar.show {
      transform: translateX(-50%) translateY(0);
    }

    #snackbar.success {
      background: #2f9e44;
    }

    #snackbar.error {
      background: #e03131;
    }

    /* ── CURSOR MODES ── */
    #canvas-area.mode-select {
      cursor: default;
    }

    #canvas-area.mode-rect {
      cursor: crosshair;
    }

    #canvas-area.mode-ellipse {
      cursor: crosshair;
    }

    #canvas-area.mode-line {
      cursor: crosshair;
    }

    #canvas-area.mode-text {
      cursor: text;
    }

    #canvas-area.mode-pan {
      cursor: grab;
    }

    #canvas-area.mode-pan.panning {
      cursor: grabbing;
    }

    /* range inputs */
    input[type="range"] {
      appearance: none;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #ddd;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    /* ── DIALOGS ── */
    .dialog-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }

    .dialog-backdrop.open {
      display: flex;
    }

    .dialog-box {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
    }

    .dialog-box h3 {
      margin-bottom: 14px;
      font-size: 16px;
    }

    .dialog-btns {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .dialog-btns button {
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--panel-border);
      background: #fafafa;
      color: var(--text);
      transition: background 0.15s;
    }

    .dialog-btns button.ok {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .dialog-btns button.ok:hover {
      background: var(--accent-hover);
    }

    .canvas-size-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .canvas-size-row label {
      font-size: 13px;
      color: var(--text-muted);
      width: 70px;
    }

    .canvas-size-row input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    .canvas-size-row input:focus {
      border-color: var(--accent);
    }

    #text-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    #text-input:focus {
      border-color: var(--accent);
    }

    /* scrollbars */
    #canvas-area::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    #canvas-area::-webkit-scrollbar-track {
      background: var(--canvas-bg);
    }

    #canvas-area::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 4px;
    }

    #right-panel::-webkit-scrollbar {
      width: 4px;
    }

    #right-panel::-webkit-scrollbar-thumb {
      background: #ddd;
      border-radius: 2px;
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <div id="topbar">
    <div id="logo">SVG Editor</div>
    <div class="tb-sep"></div>

    <button
      class="tb-btn"
      id="btn-new"
    >
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <rect
          x="3"
          y="3"
          width="18"
          height="18"
          rx="2"
        />
        <line
          x1="12"
          y1="8"
          x2="12"
          y2="16"
        />
        <line
          x1="8"
          y1="12"
          x2="16"
          y2="12"
        />
      </svg>New
    </button>
    <label
      class="tb-btn"
      style="cursor:pointer"
    >
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
      </svg>Open SVG
      <input
        type="file"
        id="file-input"
        accept=".svg,image/svg+xml"
      >
    </label>
    <label
      class="tb-btn"
      style="cursor:pointer"
      id="btn-insert-image-label"
    >
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <rect
          x="3"
          y="3"
          width="18"
          height="18"
          rx="2"
        />
        <circle
          cx="8.5"
          cy="8.5"
          r="1.5"
        />
        <polyline points="21 15 16 10 5 21" />
      </svg>Image
      <input
        type="file"
        id="image-input"
        accept="image/png,image/jpeg,image/webp,image/gif"
      >
    </label>

    <div class="tb-sep"></div>

    <button
      class="tb-btn"
      id="btn-undo"
      disabled
    >
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <polyline points="9 14 4 9 9 4" />
        <path d="M20 20v-7a4 4 0 0 0-4-4H4" />
      </svg>Undo
    </button>
    <button
      class="tb-btn"
      id="btn-redo"
      disabled
    >
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <polyline points="15 14 20 9 15 4" />
        <path d="M4 20v-7a4 4 0 0 1 4-4h12" />
      </svg>Redo
    </button>

    <div class="tb-sep"></div>

    <button
      class="tb-btn"
      id="btn-zoom-out"
    ><svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle
          cx="11"
          cy="11"
          r="8"
        />
